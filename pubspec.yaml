name: rainbow_app
description: Operation Rainbow - Plateau State Emergency Security Response App
publish_to: 'none'
version: 1.0.3+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  battery_plus: ^6.1.1
  cloud_firestore: ^6.2.0
  cloud_functions: ^6.2.0
  collection: ^1.18.0
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.8
  crypto: any
  firebase_app_check: ^0.4.2
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  firebase_crashlytics: ^5.2.2
  firebase_database: ^12.2.0
  firebase_messaging: ^16.1.3
  firebase_storage: ^13.2.0
  flutter:
    sdk: flutter
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  flutter_dotenv: ^6.0.0
  flutter_map: ^7.0.2
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  freezed_annotation: any
  geolocator: ^14.0.2
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  http: ^1.6.0
  image_picker: ^1.2.2
  json_annotation: any
  latlong2: ^0.9.1
  local_auth: ^2.2.0
  logger: any
  path_provider: ^2.1.3
  package_info_plus: ^9.0.1
  permission_handler: ^12.0.1
  record: ^6.2.1
  speech_to_text: any
  flutter_tts: any
  riverpod_annotation: any
  sentry_flutter: ^8.14.2
  share_plus: ^12.0.2
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.0
  url_launcher: ^6.3.2
  workmanager: ^0.9.0+3

dev_dependencies:
  build_runner: any
  custom_lint: ^0.7.6
  fake_cloud_firestore: ^4.1.1
  firebase_auth_mocks: ^0.15.2
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: any
  json_serializable: any
  riverpod_generator: any
  riverpod_lint: ^2.6.5
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_large.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_large.png"
  web:
    generate: false
  windows:
    generate: false

# Pin url_launcher_android to avoid D8 nest-mate compilation error
# introduced in 6.3.15+ on Android Gradle Plugin 8.11.x (AGP bug).
dependency_overrides:
  url_launcher_android: 6.3.14
