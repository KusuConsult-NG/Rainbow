name: rainbow_app
description: Operation Rainbow - Plateau State Emergency Security Response App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  cloud_functions: ^6.2.0
  firebase_database: ^12.2.0
  firebase_storage: ^13.2.0
  flutter_riverpod: ^3.3.1
  geolocator: ^14.0.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.2.2
  firebase_app_check: ^0.4.2
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.1.1
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  firebase_messaging: ^16.1.3
  image_picker: ^1.2.2
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

# Pin url_launcher_android to avoid D8 nest-mate compilation error
# introduced in 6.3.15+ on Android Gradle Plugin 8.11.x (AGP bug).
dependency_overrides:
  url_launcher_android: 6.3.14
