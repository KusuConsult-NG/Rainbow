name: rainbow_app
description: Operation Rainbow - Plateau State Emergency Security Response App
publish_to: 'none'
version: 1.0.7+28

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  battery_plus: ^6.1.1
  collection: ^1.18.0
  connectivity_plus: ^7.1.1
  crypto: any
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  flutter_dotenv: ^6.0.0
  flutter_map: ^7.0.2
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  flutter_tts: any
  flutter_webrtc: ^0.12.5
  freezed_annotation: any
  geolocator: ^14.0.2
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  http: ^1.6.0
  image_picker: ^1.2.2
  json_annotation: any
  latlong2: ^0.9.1
  local_auth: ^2.2.0
  logger: any
  onesignal_flutter: ^5.3.1
  package_info_plus: ^9.0.1
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^12.0.1
  record: ^6.2.1
  riverpod_annotation: any
  sentry_flutter: ^8.14.2
  share_plus: ^12.0.2
  shared_preferences: ^2.2.2
  speech_to_text: any
  sqflite: ^2.3.0
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.2
  workmanager: ^0.9.0+3

dev_dependencies:
  build_runner: any
  custom_lint: ^0.7.6
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: any
  geolocator_platform_interface: any
  integration_test:
    sdk: flutter
  json_serializable: any
  mocktail: ^1.0.4
  plugin_platform_interface: any
  riverpod_generator: any
  riverpod_lint: ^2.6.5
  sqflite_common_ffi: ^2.3.3
  very_good_analysis: ^10.1.0
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    # Outfit and Inter, bundled rather than fetched.
    #
    # `google_fonts` downloads font files over HTTP on first use. A UI test
    # against the web build with fonts.gstatic.com unreachable rendered EVERY
    # LABEL BLANK — logo and icons drew, but the panic button had no text on it.
    # For an app used on Nigerian rural links, legible text cannot depend on
    # reaching a Google CDN. `main.dart` sets allowRuntimeFetching = false so a
    # missing weight fails loudly in development instead of silently at 3am.
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_large.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_large.png"
  web:
    generate: false
  windows:
    generate: false

# Pin url_launcher_android to avoid D8 nest-mate compilation error
# introduced in 6.3.15+ on Android Gradle Plugin 8.11.x (AGP bug).
dependency_overrides:
  url_launcher_android: 6.3.14
