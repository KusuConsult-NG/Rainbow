name: CI

# Nothing enforced build/lint/tests before this workflow existed, which is how a
# hard `next build` failure and a service_role key in the public client bundle
# both reached the default branch. Each job below maps to a finding in
# E2E_AUDIT_REPORT.md.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml declares `.env` as a Flutter ASSET, so the file must exist
      # or `flutter test` fails with "asset not found" before running anything.
      # The example file carries no real values — tests must not need secrets.
      - name: Provision .env from template
        run: cp .env.example .env

      - run: flutter --version
      - run: flutter pub get

      # Regression guard for H-3. `.env` is a Flutter ASSET, so it ships verbatim
      # in the APK and extracts with `unzip`. The Termii credential lived there
      # until it was moved behind /api/sos/dispatch-sms. Nothing in the app may
      # talk to an SMS provider directly again, because doing so requires putting
      # the key back on the device.
      - name: Assert no SMS provider credential on the device
        run: |
          set -uo pipefail
          # Comment lines are excluded: this file and several source files explain
          # WHY these names are gone, and a gate that fires on its own rationale
          # gets deleted rather than fixed.
          #
          # The exclusion is anchored to `<path>:<line>:` because an unanchored
          # `//` also matches the `://` inside a URL — which silently made the
          # endpoint check blind to `https://api.ng.termii.com`, the exact string
          # it exists to find. Verified both ways before committing.
          scan() { grep -rnE "$1" $2 2>/dev/null | grep -vE '^[^:]*:[0-9]+:[[:space:]]*(//|#)'; }

          FAIL=0
          if scan 'termii\.com' 'lib/'; then
            echo "::error::Dart source calls the Termii API directly — that requires shipping TERMII_API_KEY inside the APK (H-3). Use SosDispatchService."
            FAIL=1
          fi
          if scan 'TERMII_API_KEY|CLOUDINARY_API_SECRET|HMAC_SECRET' 'lib/ .env.example'; then
            echo "::error::A server-side secret is referenced by mobile code or its env template. Secrets belong behind an authenticated backend endpoint (H-3)."
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "OK: no SMS provider credential is reachable from the handset."

      # ── Analyze: BLOCKING on errors ───────────────────────────────────────
      #
      # This was `continue-on-error: true` while the codebase carried 39
      # error-severity findings. Those are now all cleared, so the gate is real:
      # any new error-severity lint fails the build.
      #
      # `analysis_options.yaml` promotes three rules to error severity —
      # unawaited_futures, discarded_futures, avoid_dynamic_calls — so this
      # guards against fire-and-forget futures and untyped dynamic access
      # creeping back in.
      #
      # Infos and warnings stay non-fatal: 755 infos and 54 warnings remain
      # (line length, directive ordering, unused imports in the test suite).
      # RATCHET: clear the 54 warnings, then drop `--no-fatal-warnings`; then
      # the infos, then `--no-fatal-infos`.
      - name: Analyze
        # RATCHET, 2026-09-02: warnings now FAIL the build. They were 53 (30
        # unused imports, dead code, missing type arguments) and are now ZERO.
        #
        # Infos stay non-fatal, but that flag means much less than it did: the
        # info-level rules that catch real defects were promoted to `error` in
        # analysis_options.yaml and block regardless. What remains behind it is
        # three style rules, each exempted there with a written reason.
        #
        # The grep, rather than plain `--fatal-warnings`, exists for ONE reason.
        # Flutter 3.47.2 emits an analyzer warning that no change to this
        # repository can clear:
        #
        #   warning • Support for legacy plugins is deprecated, and will be
        #             removed in an upcoming version of Dart.
        #
        # That is the SDK talking about `custom_lint`'s plugin API — the
        # mechanism riverpod_lint is loaded through — not about our code. It
        # appears on 3.47.2 and not on 3.47.0, so it is a toolchain notice that
        # would otherwise turn this gate permanently red on a schedule we do not
        # control. Dropping it is narrow, named, and visible in the log; the
        # alternative was to abandon the ratchet entirely for a message we
        # cannot act on. Delete this filter once custom_lint migrates.
        run: |
          set -uo pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.txt || true
          # `[[:space:]]*`, not `+`: analyze prints some severity lines flush to
          # column 0 and indents others. Requiring leading whitespace made this
          # gate unable to fire at all — found by mutation-testing it with a
          # deliberately unused import, which it waved through.
          REAL=$(grep -E '^[[:space:]]*(error|warning) •' analyze.txt \
                 | grep -v 'Support for legacy plugins is deprecated' || true)
          if [ -n "$REAL" ]; then
            echo "$REAL"
            echo "::error::flutter analyze reported an error or warning (see above)"
            exit 1
          fi
          echo "OK: no analyzer errors or warnings."

      - name: Test
        run: flutter test

      # SupabaseConfig.clientOverride exists so widget tests can render screens
      # that reach for the client. It is a static mutable pointing at
      # the whole app's database access, so production code must never call it:
      # one call from lib/ would silently redirect every query in the app. It is
      # @visibleForTesting, but that is an analyzer info the CI gate does not
      # fail on, so the ban is enforced here instead.
      - name: Assert the test-only Supabase seam is not used in production code
        run: |
          set -euo pipefail
          HITS=$(grep -rn "clientOverride" lib \
                   --include=*.dart \
                 | grep -v '^lib/core/supabase/supabase_config.dart:' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::the Supabase test seam must not be called from lib/"
            exit 1
          fi
          # ...and the seam must still exist, or the guard is guarding nothing
          # and every widget test that renders a client-touching screen breaks.
          grep -q "static set clientOverride" lib/core/supabase/supabase_config.dart \
            || { echo "::error::the Supabase test seam is gone"; exit 1; }
          echo "OK: the Supabase test seam exists and is confined to tests."

      # A UI test driving the built web app in a real browser found two things
      # that only appear once it is running: with gstatic.com unreachable every
      # label rendered BLANK (CanvasKit and google_fonts are fetched at runtime
      # by default), and `GET /assets/.env` returned the file with SAFE_PIN and
      # DURESS_PIN in it. build_web.sh bundles the resources and strips the env
      # file, then asserts both. Running it here keeps the web target honest.
      # The Android release build applied com.google.gms.google-services while
      # pubspec.yaml carried no Firebase dependency at all. That plugin fails the
      # build outright when android/app/google-services.json is absent — and that
      # file is gitignored because it holds an API key — so `flutter build apk
      # --release` could not succeed on any clean checkout, including a CI
      # runner or a new machine. There is no Flutter build of the Android target
      # in this job (it needs a full Android SDK), so guard it statically.
      - name: Assert the Android build needs no Firebase config
        run: |
          set -euo pipefail
          if grep -rn "com.google.gms.google-services" android/; then
            echo "::error::the google-services Gradle plugin is back; a clean checkout cannot build a release APK without android/app/google-services.json, which is gitignored."
            exit 1
          fi
          if git ls-files | grep -iE 'google-services\.json|GoogleService-Info.*\.plist'; then
            echo "::error::a Firebase config file is tracked again — it carries an API key (H-6)."
            exit 1
          fi
          echo "OK: no Firebase config needed to build the mobile app."

      - name: Build web safely (bundled resources, no .env in the bundle)
        run: ./scripts/build_web.sh

      - name: Assert the web bundle really cannot serve .env
        run: |
          set -euo pipefail
          if [ -f build/web/assets/.env ]; then
            echo "::error::.env survived into the web bundle — it would be served at /assets/.env"
            exit 1
          fi
          # The fonts must be bundled, or text renders blank without the CDN.
          test -d build/web/assets/assets/google_fonts \
            || { echo "::error::Fonts are not bundled; text will not render without fonts.gstatic.com"; exit 1; }
          echo "OK: no .env in the bundle, fonts bundled."

  web:
    name: HQ dashboard — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hq-dashboard-next
    env:
      # Placeholders only. The build must not depend on real credentials, and the
      # secret-scan step below proves none are baked into the client bundle.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key_CI_SENTINEL
      # The SMS credential relocated here from the mobile app (H-3). The scan
      # below proves it does not reach a browser chunk on the way.
      TERMII_API_KEY: placeholder_termii_key_CI_SENTINEL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hq-dashboard-next/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      # The console had NO unit tests until the set-state-in-effect allowlist was
      # cleared — only a browser script that checks routes return 200, which
      # cannot tell you a panel silently stopped refreshing. These are the
      # characterisation tests each of those refactors went in behind.
      - name: Component tests
        run: npm test

      # The two hooks rules are `error` project-wide with NO allowlist. This
      # asserts the allowlist has not quietly come back: re-adding one would
      # turn a blocking error into a warning and `npx eslint` would still exit 0,
      # so the lint step above cannot detect it on its own.
      # The console used to @import Inter and Outfit from fonts.googleapis.com at
      # runtime. On a restricted government network that request fails and
      # every label silently falls back to a system font — the exact failure
      # the Flutter web target had before build_web.sh bundled its resources.
      # The fonts are now self-hosted via next/font/local; nothing in source
      # may fetch them from Google again. Comment lines are excluded, anchored
      # to `<path>:<line>:` so the `//` inside a URL is not mistaken for one.
      - name: Assert no runtime Google Fonts dependency
        run: |
          set -euo pipefail
          HITS=$(grep -rnE 'fonts\.(googleapis|gstatic)\.com' src/ \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::source references Google Fonts at runtime — use next/font/local (src/app/fonts.ts)"
            exit 1
          fi
          test -f src/app/fonts.ts || { echo "::error::src/app/fonts.ts is gone"; exit 1; }
          echo "OK: fonts are self-hosted; no runtime Google Fonts reference in source."

      - name: Assert the hooks-rule allowlist has not returned
        run: |
          set -euo pipefail
          if grep -qE '"react-hooks/(set-state-in-effect|immutability)":\s*"(warn|off)"' \
               eslint.config.mjs; then
            grep -nE '"react-hooks/(set-state-in-effect|immutability)"' eslint.config.mjs
            echo "::error::a hooks rule was downgraded from error — fix the site, do not exempt it"
            exit 1
          fi
          echo "OK: both hooks rules are error everywhere, no exceptions."

      # Regression guard for H-1: a module-scope createClient() with missing env
      # crashed page-data collection. `next dev` compiles lazily and never caught it.
      - name: Build
        run: npx next build

      # Regression guard for C-1 (critical): the Supabase service_role key was
      # emitted into a client chunk loaded by the PUBLIC /login page.
      - name: Scan client bundle for leaked secrets
        run: |
          set -euo pipefail
          echo "Scanning .next/static for server-side secrets..."
          FAIL=0

          # Patterns must match KEY MATERIAL, not the literal prefix. A bare
          # 'sb_secret' matches @supabase/supabase-js's own key-type check
          # (`e.startsWith("sb_secret_")`) and fires on every clean build.
          # Verified: these catch the real leak
          #   ***REMOVED-SECRET***
          # and do not match the library's prefix code.
          for PATTERN in \
            'sb_secret_[A-Za-z0-9_-]{16,}' \
            'eyJhbGciOi[A-Za-z0-9_-]{20,}' \
            'CI_SENTINEL' \
            'SUPABASE_SERVICE_ROLE_KEY' \
            'TERMII_API_KEY' \
            'GEMINI_API_KEY' \
            'AIza[A-Za-z0-9_-]{20,}'
          do
            if grep -rlE "$PATTERN" .next/static/ 2>/dev/null; then
              echo "::error::/$PATTERN/ matched in the client bundle — a server secret is being shipped to browsers."
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "OK: no server secrets in client bundle."

      # Regression guard for H-2: demo credentials were rendered on the public
      # login page. They must be compiled out of production builds.
      - name: Assert demo credentials absent from production bundle
        run: |
          set -euo pipefail
          if grep -rl '12345Gg' .next/static/ 2>/dev/null; then
            echo "::error::Demo password found in production client bundle."
            exit 1
          fi
          echo "OK: no demo credentials in bundle."

      # A UI pass driving a real browser found the login page carried NO
      # protective headers at all: any site could iframe the command console and
      # overlay a lookalike to harvest badge IDs and PINs.
      #
      # This asks the running server, not next.config.ts. A header can be
      # configured and still not reach the wire — the proxy sits in front of
      # /dashboard and builds its own responses — so the assertion has to be
      # made against an actual HTTP response on both a public and a guarded path.
      - name: Assert security headers reach the wire
        run: |
          set -euo pipefail

          # Redirect the server's output to a file. A background process that
          # inherits the step's stdout keeps that pipe open after the shell
          # exits, and the runner waits on it.
          npx next start -p 3200 > /tmp/next-ci.log 2>&1 &
          SERVER_PID=$!

          # Kill the server's whole descendant tree, BY PID.
          #
          # Never `kill -- -$PGID` here. An earlier version of this step did
          # exactly that, to tidy away an "orphan process" notice, and it took
          # the runner down with it: the step's own shell and the runner agent
          # share that process group, so the group kill reached them too. Both
          # runs died with "The runner has received a shutdown signal" straight
          # after this step printed its last OK line — every assertion had
          # passed, and the job still failed.
          #
          # `pkill -P` is not enough either: npx spawns `sh -c next start`,
          # which spawns next-server, so the grandchild survives a one-level
          # kill. Recurse.
          kill_tree() {
            local pid=$1 child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child"
            done
            kill "$pid" 2>/dev/null || true
          }
          trap 'kill_tree "$SERVER_PID"' EXIT

          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3200/login && break
            sleep 1
          done

          FAIL=0
          for PATH_UNDER_TEST in /login /dashboard; do
            H=$(curl -sI "http://localhost:3200${PATH_UNDER_TEST}")
            echo "--- ${PATH_UNDER_TEST} ---"
            # frame-ancestors is the directive that closes the clickjacking hole;
            # X-Frame-Options covers browsers that ignore CSP framing.
            for NEEDLE in \
              'X-Frame-Options: DENY' \
              "frame-ancestors 'none'" \
              'X-Content-Type-Options: nosniff' \
              'Referrer-Policy:' \
              'Permissions-Policy:' \
              'Strict-Transport-Security:'
            do
              if printf '%s' "$H" | grep -qiF "$NEEDLE"; then
                echo "  ok: ${NEEDLE}"
              else
                echo "::error::${PATH_UNDER_TEST} is missing '${NEEDLE}'"
                FAIL=1
              fi
            done
            # Do not advertise the framework version to anyone scanning for a
            # known-vulnerable release.
            if printf '%s' "$H" | grep -qi '^x-powered-by:'; then
              echo "::error::${PATH_UNDER_TEST} still sends X-Powered-By"
              FAIL=1
            fi
          done

          # ── The strict-CSP properties ────────────────────────────────────
          # `script-src` used to carry 'unsafe-inline', which permits exactly the
          # injected inline script the directive exists to stop — a policy that
          # looked protective and was not. It is now nonce-based. These assert
          # the properties that make that real, because a header can contain the
          # word "nonce" and still be useless.
          CSP1=$(curl -sI http://localhost:3200/login | grep -i '^content-security-policy:')
          CSP2=$(curl -sI http://localhost:3200/login | grep -i '^content-security-policy:')
          SCRIPT_SRC=$(printf '%s' "$CSP1" | grep -o "script-src[^;]*")
          STYLE_SRC=$(printf '%s' "$CSP1" | grep -o "style-src[^;]*")

          if printf '%s' "$SCRIPT_SRC" | grep -q "'unsafe-inline'"; then
            echo "::error::script-src carries 'unsafe-inline' — the policy does not stop injected script"
            FAIL=1
          else
            echo "  ok: script-src has no 'unsafe-inline'"
          fi

          for NEEDLE in "'nonce-" "'strict-dynamic'"; do
            if printf '%s' "$SCRIPT_SRC" | grep -qF "$NEEDLE"; then
              echo "  ok: script-src carries ${NEEDLE}"
            else
              echo "::error::script-src is missing ${NEEDLE}"
              FAIL=1
            fi
          done

          # A nonce reused across requests is a nonce an attacker can read off
          # one response and replay into the next.
          N1=$(printf '%s' "$CSP1" | grep -o "'nonce-[^']*'" | head -1)
          N2=$(printf '%s' "$CSP2" | grep -o "'nonce-[^']*'" | head -1)
          if [ -n "$N1" ] && [ "$N1" != "$N2" ]; then
            echo "  ok: a fresh nonce per request"
          else
            echo "::error::the nonce is reused across requests (or absent)"
            FAIL=1
          fi

          # style-src MUST keep 'unsafe-inline' and MUST NOT gain a nonce. These
          # pages are built from React style={{…}} props, which render as style
          # attributes; a nonce here makes the browser IGNORE 'unsafe-inline'
          # and strips the styling off every page.
          if printf '%s' "$STYLE_SRC" | grep -q "'unsafe-inline'" \
             && ! printf '%s' "$STYLE_SRC" | grep -q "nonce-"; then
            echo "  ok: style-src keeps 'unsafe-inline' and has no nonce"
          else
            echo "::error::style-src must keep 'unsafe-inline' and must not carry a nonce"
            FAIL=1
          fi

          # Two CSP headers would mean the response must satisfy BOTH, and a
          # static one has no nonce — the pair would block the very scripts the
          # nonce exists to allow. This is why next.config.ts no longer sets one.
          CSP_COUNT=$(curl -sI http://localhost:3200/login | grep -ci '^content-security-policy:')
          if [ "$CSP_COUNT" -eq 1 ]; then
            echo "  ok: exactly one Content-Security-Policy header"
          else
            echo "::error::expected exactly 1 CSP header, found ${CSP_COUNT}"
            FAIL=1
          fi

          # Realtime is a WebSocket to the Supabase host. connect-src must carry
          # the ws scheme that matches the configured URL's scheme, or the
          # browser refuses the upgrade and the live feed goes quiet with no
          # error the operator can see. The first version derived it with
          # `.replace(/^https:/,'wss:')`, which emitted `wss:` for an http
          # backend and blocked realtime outright — caught by a browser run,
          # not by reading the config.
          CSP=$(curl -sI http://localhost:3200/login | grep -i '^content-security-policy:')
          case "${NEXT_PUBLIC_SUPABASE_URL}" in
            https://*) WANT="wss://${NEXT_PUBLIC_SUPABASE_URL#https://}" ;;
            http://*)  WANT="ws://${NEXT_PUBLIC_SUPABASE_URL#http://}" ;;
            *)         WANT="" ;;
          esac
          if [ -n "$WANT" ]; then
            if printf '%s' "$CSP" | grep -qF "$WANT"; then
              echo "  ok: connect-src allows ${WANT}"
            else
              echo "::error::connect-src does not allow ${WANT} — Supabase Realtime will be blocked"
              FAIL=1
            fi
          fi

          # Incident evidence — scene photos from responders and citizens — is
          # uploaded to Supabase Storage and rendered from its public URL, so
          # img-src must allow the Supabase ORIGIN as well. The first
          # nonce-based policy omitted it and silently blanked every evidence
          # photo on the console: an operator reviewing a report cannot tell a
          # blocked photo from one that was never taken. connect-src carrying
          # the host is NOT enough — images are governed by img-src alone.
          # Evidence photos are <img>, voice recordings and scene video are
          # <audio>/<video>. They come from ONE origin but are governed by TWO
          # different directives, and both were wrong: img-src omitted the
          # origin, and media-src did not exist at all so it fell back to
          # `default-src 'self'`. Checking one does not cover the other, which
          # is exactly how the second half survived fixing the first.
          # Inter and Outfit are self-hosted (src/app/fonts.ts). If either Google
          # Fonts host reappears in the policy, the runtime dependency that
          # blanked the Flutter web target on a restricted network has crept
          # back into the console — and font-src/style-src are once again
          # unverifiable from an environment without egress.
          if printf '%s' "$CSP" | grep -qE 'fonts\.(googleapis|gstatic)\.com'; then
            echo "::error::the CSP names a Google Fonts host — fonts must stay self-hosted"
            FAIL=1
          else
            echo "  ok: no Google Fonts host in the policy (fonts are self-hosted)"
          fi

          for D in img-src media-src; do
            VAL=$(printf '%s' "$CSP" | tr ';' '\n' | grep -i "$D" || true)
            if [ -z "$VAL" ]; then
              echo "::error::${D} is missing entirely — it falls back to default-src 'self' and blocks incident evidence"
              FAIL=1
            elif printf '%s' "$VAL" | grep -qF "${NEXT_PUBLIC_SUPABASE_URL}"; then
              echo "  ok: ${D} allows ${NEXT_PUBLIC_SUPABASE_URL}"
            else
              echo "  ${D} is: ${VAL}"
              echo "::error::${D} does not allow ${NEXT_PUBLIC_SUPABASE_URL} — incident evidence will be blocked"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "OK: security headers present on public and guarded routes."

      # A <label> that neither wraps its input nor carries htmlFor is styled
      # text, not a label: assistive tech announces the field as an unnamed
      # "edit text". Both login fields were in that state.
      - name: Assert login form inputs are labelled
        run: |
          set -euo pipefail
          FAIL=0
          for ID in badge-id security-pin; do
            grep -q "htmlFor=\"${ID}\"" src/app/login/page.tsx \
              || { echo "::error::no <label htmlFor=\"${ID}\">"; FAIL=1; }
            grep -q "id=\"${ID}\"" src/app/login/page.tsx \
              || { echo "::error::no input with id=\"${ID}\""; FAIL=1; }
          done
          # The show/hide PIN control is icon-only and announces as just
          # "button" without an explicit name.
          grep -q "aria-label={showPin" src/app/login/page.tsx \
            || { echo "::error::PIN visibility toggle has no aria-label"; FAIL=1; }
          # Without role="alert" a failed sign-in is drawn but never spoken.
          grep -q 'role="alert"' src/app/login/page.tsx \
            || { echo "::error::login error banner is not a live region"; FAIL=1; }
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "OK: login form is labelled for assistive technology."

  tracked-secrets:
    name: Repo — no credential material in tracked files
    runs-on: ubuntu-latest
    # Added after an audit pass found `android/GoogleService-Info1.plist` still
    # tracked, carrying a Firebase API key, MONTHS after H-6 supposedly removed
    # the committed secrets. The H-6 fix deleted one plist at the repo root and
    # added `GoogleService-Info*.plist` to .gitignore — but **.gitignore does not
    # untrack a file that is already tracked**, and nobody swept for other copies.
    #
    # A one-time cleanup cannot prevent that. A gate can.
    steps:
      - uses: actions/checkout@v4
      - name: Scan every tracked file for credential material
        run: |
          set -uo pipefail

          # There is no allowlist any more. Six files used to be exempted because
          # they carried a Firebase API key that had already been rotated — the
          # exemption was a reviewable act, and it was reviewed out of existence:
          # the git-history purge (H-6) redacted every copy of every leaked value,
          # in the working tree and in every prior commit. Any match now is a
          # NEW leak and fails the build.

          HITS=$(git ls-files -z \
            | xargs -0 grep -lEI 'AIza[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY' 2>/dev/null \
            || true)

          if [ -n "$HITS" ]; then
            echo "::error::Credential material found in newly tracked files:"
            echo "$HITS"
            echo ""
            echo "Committing a credential is not undone by adding it to .gitignore —"
            echo "an already-tracked file stays tracked. Use: git rm --cached <file>"
            echo "Then ROTATE the credential: it is in git history either way."
            exit 1
          fi
          echo "OK: no credential material in tracked files."

  dryrun-fresh:
    name: Supabase — production dry-run is in sync
    runs-on: ubuntu-latest
    # scripts/rls_production_dryrun.sql is GENERATED from the migration, with the
    # migration's own BEGIN/COMMIT stripped. A stale copy is dangerous rather than
    # merely wrong: it is pasted straight into a production SQL editor, and a
    # nested COMMIT would end the wrapping transaction and apply it for real while
    # still printing a reassuring ROLLBACK.
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and diff
        run: |
          set -euo pipefail
          python3 scripts/build_rls_dryrun.py
          python3 scripts/build_rls_inventory.py
          python3 scripts/build_apply_all.py
          python3 scripts/build_bootstrap.py
          GEN="scripts/rls_production_dryrun.sql scripts/rls_inventory.sql scripts/apply_all_migrations.sql scripts/bootstrap_staging.sql"
          if ! git diff --quiet -- $GEN; then
            echo "::error::A generated SQL script is stale. Re-run the four build_*.py generators."
            git diff -- $GEN | head -60
            exit 1
          fi
          echo "OK: all four generated scripts match the migrations."

      # The inventory's "is this policy ours?" list is extracted from the
      # migration files. A hand-written version was tried first and was
      # substantially wrong — it invented names and missed real ones, which would
      # label real policies as hand-created and could lead to dropping policies
      # the application depends on. Assert the extractor still finds them.
      - name: Assert the inventory knows the real policy names
        run: |
          set -euo pipefail
          for NAME in alerts_select_own_or_staff profiles_select_self_or_staff \
                      telemetry_select_self_or_staff safe_zones_read uninstall_read_own_or_staff; do
            grep -q "'$NAME'" scripts/rls_inventory.sql || {
              echo "::error::$NAME is created by a migration but missing from the inventory's known list."
              exit 1
            }
          done
          # And that the comment-stripping still works: 'has' came from
          # "-- CREATE POLICY has no IF NOT EXISTS" in phase3.
          if grep -q "^    'has'," scripts/rls_inventory.sql; then
            echo "::error::'has' leaked in from a comment — the extractor is not stripping comments."
            exit 1
          fi
          echo "OK: the inventory's known-policy list looks sane."

      # The generated file must contain no top-level transaction control of its
      # own beyond the wrapper's single BEGIN/ROLLBACK.
      - name: Assert no stray COMMIT survived generation
        run: |
          set -euo pipefail
          if grep -nE '^(COMMIT|START TRANSACTION)\s*;' scripts/rls_production_dryrun.sql; then
            echo "::error::A COMMIT survived generation — pasting this would apply the migration for real."
            exit 1
          fi
          test "$(grep -cE '^BEGIN\s*;' scripts/rls_production_dryrun.sql)" -eq 1
          test "$(grep -cE '^ROLLBACK\s*;' scripts/rls_production_dryrun.sql)" -eq 1
          echo "OK: exactly one BEGIN, exactly one ROLLBACK, no COMMIT."

  apply-all:
    name: Supabase — the one-paste apply script actually applies
    runs-on: ubuntu-latest
    # scripts/apply_all_migrations.sql is what somebody pastes into a production
    # SQL editor, so "it contains the right text" is the wrong test. This runs
    # the whole buffer top to bottom against a production-shaped database, twice
    # (it claims to be idempotent), and asserts on its own 14-row verdict table.
    # Mutation-checked: dropping one migration from the generator turns the
    # matching row into *** FAIL ***.
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
      - name: Apply it exactly as pasted
        run: sudo PGBIN=/usr/lib/postgresql/16/bin ./scripts/verify_apply_all.sh

  bootstrap:
    name: Supabase — the staging bootstrap builds a correct project from zero
    runs-on: ubuntu-latest
    # scripts/bootstrap_staging.sql is pasted into a brand-new Supabase project,
    # and unlike apply_all it starts from the ORIGINAL schema — whose policies
    # are open to anon until a later migration removes them. So three things
    # have to hold, and all three are asserted here rather than assumed:
    # it produces a correct schema from empty, it REFUSES a database that
    # already holds data (structurally — the whole file is one transaction, so
    # the refusal rolls back rather than half-applying), and it lands on exactly
    # the schema that replaying the migrations one at a time produces.
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
      - name: Bootstrap an empty project, then try to bootstrap a full one
        run: sudo PGBIN=/usr/lib/postgresql/16/bin ./scripts/verify_bootstrap.sh

  rls-migration:
    name: Supabase — RLS migration correctness
    runs-on: ubuntu-latest
    # Needs no credentials and touches no real data: it replays the migration
    # history into a throwaway PostgreSQL and asserts behaviour. This is the
    # gate that says the migration is CORRECT; the probe below says a live
    # database is actually locked down. They answer different questions.
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
      - name: Verify the RLS migration against a real PostgreSQL
        run: sudo PGBIN=/usr/lib/postgresql/16/bin ./scripts/verify_rls_migration.sh

      # Every table either app subscribes to for realtime must be in the
      # supabase_realtime publication, or the subscription silently never fires
      # — no error, just a view that only updates on reload. Three were missing
      # for exactly that reason. The behaviour test above asserts the publication
      # contains a fixed list; this asserts that list still covers what the code
      # actually subscribes to, so adding a new subscription cannot quietly skip
      # the migration.
      # A column name is either in the schema or it is not, and both sides are
      # in this repository — so there was never a good reason for this to be
      # found by reading. The HQ mass-broadcast screen wrote six columns that
      # existed in no migration; PostgREST rejects such an insert IN FULL, so
      # every broadcast HQ sent failed and the operator saw a raw error where a
      # statewide warning should have been. The same sweep then found two more
      # (`alerts.has_live_stream`, `profiles.last_feedback`), both wrapped in
      # catches that discarded the rejection.
      - name: Assert neither app names a column or function the schema lacks
        run: python3 scripts/check_schema_drift.py

      - name: Assert every realtime subscription is on a published table
        run: |
          set -euo pipefail
          MISSING=0
          # Two syntaxes reach realtime: the console's postgres_changes
          # subscriptions (`table: 'alerts'`) and the mobile app's
          # `from('alerts').stream(...)`, which is a realtime subscription too
          # and fails the same silent way.
          CONSOLE=$(grep -rhoE "table: '[a-z_]+'" \
                      hq-dashboard-next/src --include=*.tsx --include=*.ts \
                    | grep -oE "'[a-z_]+'")
          # The table name and `.stream(` are often on different lines, so take
          # the three lines before each `.stream(` and read the name out of them.
          MOBILE=$(grep -rhE -B3 '\.stream\(' lib --include=*.dart \
                   | grep -oE "from\('[a-z_]+'\)" | grep -oE "'[a-z_]+'" || true)
          TABLES=$(printf '%s\n%s\n' "$CONSOLE" "$MOBILE" | tr -d "'" | grep -v '^$' | sort -u)
          echo "subscribed tables: $(echo $TABLES)"
          for T in $TABLES; do
            grep -q "'$T'" supabase/migrations/20260903000000_realtime_publication.sql || {
              echo "::error::table '$T' is subscribed to for realtime but is not in the supabase_realtime publication migration."
              MISSING=1
            }
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo "OK: every realtime subscription targets a published table."

  dryrun-speaks:
    name: Supabase — the production dry run actually reports something
    runs-on: ubuntu-latest
    # The dry run is the ONLY way to find out whether the RLS migration is safe
    # to apply to the real database, because that database holds policies created
    # by hand in the dashboard which no replica can reproduce.
    #
    # Run against production, its first version returned three column headers and
    # ZERO ROWS: no error, no findings, nothing to act on. On a script whose whole
    # job is to answer "is this safe to apply", silence is indistinguishable from
    # "all clear" and is the most dangerous output it could give. Two causes — a
    # result set discarded by the rollback, and an unhandled error aborting the
    # transaction and taking every finding with it.
    #
    # So "it says something" is not a detail, it is the property the artefact
    # depends on. This gates it: a verdict is emitted, a hand-made policy that
    # re-opens a table IS detected, an assertion failure does not silence the run,
    # and nothing persists.
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
      - name: Verify the dry run emits a verdict and keeps nothing
        run: sudo PGBIN=/usr/lib/postgresql/16/bin ./scripts/verify_dryrun_emits.sh

  console-e2e:
    name: HQ console — every screen and every control, in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hq-dashboard-next/package-lock.json

      - run: npm ci
        working-directory: hq-dashboard-next

      # Every console screen in this repository went unrendered until this job
      # existed, because rendering one looked as though it needed a live
      # Supabase. It does not: the run serves a stand-in built from the
      # migrations, so a query naming a column that no migration defines is
      # rejected here exactly as PostgREST rejects it in production.
      #
      # This job proves the SCREENS. It does not prove row-level security —
      # that is the `rls` job, against a real staging project.
      # Two passes. The first renders every screen for every role; the second
      # presses every control and checks each action against the database write
      # it is supposed to cause. A button that looks right and writes nothing is
      # invisible to a screenshot.
      - name: Render every screen, then press every button
        run: ./scripts/local_e2e/run.sh

      # The screenshots are the evidence. Keep them whether or not the run
      # passed: a failure is exactly when somebody wants to see the screen.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-screens
          path: local_e2e_screenshots/
          retention-days: 14

  rls:
    name: Supabase — RLS anon-access probe
    runs-on: ubuntu-latest
    # Only runs where the staging credentials are available. Fails the build if
    # anon can read or write any sensitive table (finding C-3).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hq-dashboard-next/package-lock.json

      - run: npm ci
        working-directory: hq-dashboard-next

      - name: Probe anonymous access
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node scripts/verify_rls.js
