org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# NO org.gradle.java.home HERE.
#
# It used to pin the JDK to
# /Applications/Android Studio.app/Contents/jbr/Contents/Home — one
# developer's macOS Android Studio. This file is tracked, so that path was
# everybody's: on Linux or Windows, or on a Mac without Android Studio at
# that exact location, every `flutter build apk` died with "Java home
# supplied is invalid" before compiling a line. Gradle finds the JDK through
# JAVA_HOME or the one Flutter resolves, which is what Android Studio does
# anyway, so removing it costs that machine nothing.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# newDsl and builtInKotlin are BOTH false, which is what `flutter create`
# emits on 3.50 — checked against a generated template, not guessed.
#
# The trap: AGP 9 deprecates the old `android { }` extension, and Kotlin
# script compilation turns that deprecation into an error — but ONLY when
# app/build.gradle.kts applies `id("kotlin-android")` itself. Flutter's
# template does not apply it; it declares the Kotlin plugin in
# settings.gradle.kts with `apply false` and lets the Flutter Gradle Plugin
# apply it. Setting newDsl=true to dodge the deprecation instead makes things
# worse, because the external Kotlin plugin refuses to load against the new
# DSL at all:
#
#   The 'org.jetbrains.kotlin.android' plugin is not compatible with AGP's
#   9.0 new DSL (`android.newDsl=true` is enabled by default).
#
# So the fix is not in this file. It is to stop applying the Kotlin plugin by
# hand in app/build.gradle.kts, which is what the next commit does.
#
# Do not delete these two lines to "clean up": `flutter build` re-adds any
# missing migrator flag on every invocation, set to false, so a deletion is
# silently undone and the build breaks with nothing in the diff to show why.
android.newDsl=false
