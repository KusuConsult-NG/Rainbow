org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# NO org.gradle.java.home HERE.
#
# It used to pin the JDK to
# /Applications/Android Studio.app/Contents/jbr/Contents/Home — one
# developer's macOS Android Studio. This file is tracked, so that path was
# everybody's: on Linux or Windows, or on a Mac without Android Studio at
# that exact location, every `flutter build apk` died with "Java home
# supplied is invalid" before compiling a line. Gradle finds the JDK through
# JAVA_HOME or the one Flutter resolves, which is what Android Studio does
# anyway, so removing it costs that machine nothing.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
