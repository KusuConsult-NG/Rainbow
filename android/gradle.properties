org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# NO org.gradle.java.home HERE.
#
# It used to pin the JDK to
# /Applications/Android Studio.app/Contents/jbr/Contents/Home — one
# developer's macOS Android Studio. This file is tracked, so that path was
# everybody's: on Linux or Windows, or on a Mac without Android Studio at
# that exact location, every `flutter build apk` died with "Java home
# supplied is invalid" before compiling a line. Gradle finds the JDK through
# JAVA_HOME or the one Flutter resolves, which is what Android Studio does
# anyway, so removing it costs that machine nothing.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# NO android.newDsl=false.
#
# The Flutter migrator added it to keep the old Android DSL while AGP 8 still
# offered both. Under AGP 9 the old one is deprecated, and Kotlin script
# compilation treats that as an error, so with this flag set `android { }`
# itself fails to compile:
#
#   'fun Project.android(configure: Action<BaseAppModuleExtension>): Unit' is
#   deprecated. Replaced by com.android.build.api.dsl.ApplicationExtension.
#
# Removing it is NOT enough: `flutter build` re-adds it, set to false, on
# every invocation — the migrator only checks whether the key is present. So
# deleting the line gets silently undone, in CI as much as on a laptop, and
# the build fails again with no sign of why.
#
# Set explicitly to true instead. The key is present, so the migrator leaves
# it alone, and the value is the one AGP 9 defaults to and that the DSL in
# app/build.gradle.kts is written against.
android.newDsl=true
